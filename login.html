{% extends "base.html" %}
{% block content %}
<div style="max-width:420px; margin:20px auto;">
  <div class="card">
    <h2>Log in</h2>
    <form method="POST">
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button class="btn" type="submit" style="width:100%;">Log in</button>
    </form>
    <p style="font-size:0.85rem; color:var(--ink-light); margin-top:16px;">
      New here? <a href="{{ url_for('register') }}">Create a patient account</a>
    </p>
  </div>
</div>
{% endblock %}
