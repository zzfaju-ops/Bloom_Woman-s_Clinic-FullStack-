{% extends "base.html" %}
{% block content %}
<div style="max-width:520px; margin:20px auto;">
  <div class="card">
    <h2>Create your patient account</h2>
    <form method="POST">
      <div class="field">
        <label>Full name</label>
        <input type="text" name="full_name" required>
      </div>
      <div class="grid grid-2">
        <div class="field">
          <label>Email</label>
          <input type="email" name="email" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" required>
        </div>
      </div>
      <div class="grid grid-2">
        <div class="field">
          <label>Date of birth</label>
          <input type="date" name="dob">
        </div>
        <div class="field">
          <label>Phone</label>
          <input type="tel" name="phone">
        </div>
      </div>
      <div class="field">
        <label>Address</label>
        <input type="text" name="address">
      </div>
      <button class="btn" type="submit" style="width:100%;">Create account</button>
    </form>
    <p style="font-size:0.85rem; color:var(--ink-light); margin-top:16px;">
      Already have an account? <a href="{{ url_for('login') }}">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
