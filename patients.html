{% extends "base.html" %}
{% block content %}
<h1 style="color:var(--pink-dark);">Patients</h1>

<div class="card">
  <form method="GET" style="display:flex; gap:10px;">
    <input type="text" name="q" placeholder="Search by name..." value="{{ q }}" style="flex:1;">
    <button class="btn" type="submit">Search</button>
  </form>
</div>

<div class="card">
  {% if patients %}
    <table>
      <tr><th>Name</th><th>Age</th><th>Phone</th><th>Appointments</th><th></th></tr>
      {% for p in patients %}
      <tr>
        <td>{{ p.full_name }}</td>
        <td>{{ p.age() or "—" }}</td>
        <td>{{ p.phone or "—" }}</td>
        <td>{{ p.appointments|length }}</td>
        <td><a href="{{ url_for('admin_patient_detail', patient_id=p.id) }}" class="btn btn-sm btn-outline">Open chart</a></td>
      </tr>
      {% endfor %}
    </table>
  {% else %}
    <p class="empty">No patients found.</p>
  {% endif %}
</div>
{% endblock %}
